name: Reusable Linux desktop and Debian package
on:
  workflow_call:
    inputs:
      ref:
        description: Exact 40-character commit SHA to build
        required: true
        type: string
      release:
        description: Produce a release candidate without test reports
        type: boolean
        default: false
      artifact_name:
        description: Name of the package artifact
        required: true
        type: string
permissions:
  contents: read
jobs:
  debian:
    # Build with glibc 2.35 so the same package can run on Ubuntu 22.04.
    # Ubuntu 24.04's host policy restricts them even in an unconfined container.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    container:
      image: ubuntu:22.04
      # docker-default AppArmor denies bubblewrap's private mount namespace.
      # Relax only this disposable outer container; WebKit keeps its sandbox.
      options: --init --dns 1.1.1.1 --dns 8.8.8.8 --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=unconfined
    steps:
      - name: Install build and test dependencies
        run: |
          getent hosts archive.ubuntu.com
          getent hosts security.ubuntu.com
          apt-get -o APT::Update::Error-Mode=any update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libjson-glib-dev dpkg-dev curl ca-certificates git qemu-system-x86 qemu-utils ovmf openssh-client iproute2 dbus-x11 xvfb xauth fonts-noto-cjk zsh sudo tzdata
          # Ubuntu 22.04 predates safe.bareRepository. Build the signed upstream
          # v2.52.0 revision on this ABI without needing the Launchpad PPA API.
          DEBIAN_FRONTEND=noninteractive apt-get install -y libssl-dev libcurl4-openssl-dev libexpat1-dev zlib1g-dev gettext
          git init -q /tmp/git-source
          git -C /tmp/git-source fetch --depth=1 https://github.com/git/git.git 9a2fb147f2c61d0cab52c883e7e26f5b7948e3ed
          git -C /tmp/git-source checkout --detach FETCH_HEAD
          test "$(git -C /tmp/git-source rev-parse HEAD)" = 9a2fb147f2c61d0cab52c883e7e26f5b7948e3ed
          make -C /tmp/git-source -j4 prefix=/usr/local NO_TCLTK=YesPlease install > /tmp/git-install.log
          hash -r
          dpkg --compare-versions "$(git --version | awk '{print $3}')" ge 2.38
          useradd -m -s /bin/bash cage
          echo "cage ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/cage
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify the immutable build revision
        env:
          CAGE_BUILD_REF: ${{ inputs.ref }}
          CAGE_RELEASE: ${{ inputs.release }}
        run: |
          # checkout's temporary HOME does not persist into later container
          # steps. Trust this CI-owned checkout only, before root builds it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$CAGE_BUILD_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Build ref must be a complete commit SHA.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${CAGE_BUILD_REF,,}" ]] || { echo 'Checkout differs from the requested commit.' >&2; exit 1; }
          if [[ "$CAGE_RELEASE" == true && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo 'Release candidates require an explicitly dispatched release workflow.' >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build Linux application and package
        run: |
          node scripts/check-version.mjs
          bash scripts/build-linux.sh
          bash scripts/package-linux.sh --skip-build
          npm test --prefix ui
          npm run --prefix ui lint
          node --test internal/cage/browser-clipboard.test.mjs internal/cage/native-input.test.mjs internal/cage/display-density.test.mjs
      - name: Linux executable tests as an ordinary user
        env:
          UV_CACHE_DIR: /home/cage/.cache/uv
          UV_PYTHON_INSTALL_DIR: /home/cage/.local/share/uv/python
          UV_PYTHON: '3.11'
        run: |
          chown -R cage:cage "$GITHUB_WORKSPACE"
          # uv's setup step runs as root; its cache and managed Python must not
          # leak into ordinary-user tests, including tests that isolate HOME.
          runuser -u cage -- uv python install 3.11
          runuser -u cage -- go test ./internal/... ./cmd/...
          runuser -u cage -- go vet ./internal/managedproxy ./internal/workbench ./cmd/cage
          runuser -u cage -- uv run --no-project --python 3.11 internal/cage/desktop-downloads.test.py
          runuser -u cage -- uv run --no-project --python 3.11 internal/cage/display-governor.test.py
      - name: Ubuntu guest browser, extensions and noVNC dependencies
        run: runuser -u cage -- bash scripts/test-ubuntu-guest.sh
      - name: Install, render native workbench, reinstall and remove
        run: |
          runuser -u cage -- bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev -- true
          version=$(cat VERSION)
          bash scripts/test-linux-install.sh "_output/releases/$version/linux/Cage-$version-linux-amd64.deb"
      - name: Record release candidate identity
        if: ${{ inputs.release }}
        run: |
          version=$(cat VERSION)
          node scripts/release-version.mjs metadata linux "_output/releases/$version/linux/build-metadata.json"
      - name: Upload verified package and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            _output/releases/*/linux/Cage-*-linux-amd64.deb
            _output/releases/*/linux/SHA256SUMS
            _output/releases/*/linux/mihomo-*-source.tar.gz
            _output/releases/*/linux/build-metadata.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Preserve public development test reports
        if: ${{ always() && !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-reports
          path: |
            /home/cage-package-test/reports/install.json
            /home/cage-package-test/reports/first-install.json
            /home/cage-package-test/reports/first-install.json.png
            /home/cage-package-test/reports/after-reinstall.json
            /home/cage-package-test/reports/after-reinstall.json.png
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      # KVM and physical desktop acceptance remain separate real-machine checks.

  package-compatibility:
    needs: debian
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, ubuntu:24.04]
    container:
      image: ${{ matrix.image }}
      options: --init --dns 1.1.1.1 --dns 8.8.8.8 --security-opt seccomp=unconfined --security-opt systempaths=unconfined --security-opt apparmor=unconfined
    steps:
      - name: Install package test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates git dbus-x11 xvfb xauth fonts-noto-cjk
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: _output/compatibility
      - name: Test the Ubuntu 22.04-built package unchanged
        shell: bash
        run: |
          package=$(find _output/compatibility -name 'Cage-*-linux-amd64.deb' -print -quit)
          test -n "$package"
          bash scripts/test-linux-install.sh "$package"
